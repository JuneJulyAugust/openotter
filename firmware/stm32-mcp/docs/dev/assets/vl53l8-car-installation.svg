<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VL53L8 Front and Rear Car Installation</title>
  <desc id="desc">Side view of RC car showing front and rear ToF case placement, optical field of view cones, harness routing, strain relief, and occlusion keepout.</desc>
  <defs>
    <style>
      .label { font: 19px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #374151; }
      .tiny { font: 12px sans-serif; fill: #374151; }
      .chassis { fill: #d1d5db; stroke: #374151; stroke-width: 3; }
      .case { fill: #e0f2fe; stroke: #075985; stroke-width: 3; }
      .bumper { fill: #4b5563; stroke: #111827; stroke-width: 3; }
      .fov { fill: #38bdf8; fill-opacity: 0.18; stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 7; }
      .harness { fill: none; stroke: #111827; stroke-width: 5; }
      .tie { fill: #f8fafc; stroke: #111827; stroke-width: 2; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .ok { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="label">Install the case on a vertical front/rear face, lid and optical aperture facing outward</text>

  <rect x="210" y="285" width="780" height="145" rx="20" class="chassis"/>
  <rect x="155" y="320" width="65" height="85" rx="10" class="bumper"/>
  <rect x="980" y="320" width="65" height="85" rx="10" class="bumper"/>
  <circle cx="310" cy="465" r="58" fill="#111827"/>
  <circle cx="310" cy="465" r="30" fill="#6b7280"/>
  <circle cx="890" cy="465" r="58" fill="#111827"/>
  <circle cx="890" cy="465" r="30" fill="#6b7280"/>

  <rect x="120" y="310" width="44" height="105" rx="8" class="case"/>
  <rect x="1040" y="310" width="44" height="105" rx="8" class="case"/>
  <text x="142" y="300" text-anchor="middle" class="small">REAR</text>
  <text x="1062" y="300" text-anchor="middle" class="small">FRONT</text>

  <polygon points="120,362 35,280 35,445" class="fov"/>
  <polygon points="1084,362 1170,280 1170,445" class="fov"/>
  <text x="70" y="268" text-anchor="middle" class="tiny">keep clear</text>
  <text x="1135" y="268" text-anchor="middle" class="tiny">keep clear</text>

  <path d="M164 342 C250 250 390 242 500 275 C590 302 675 302 785 275 C890 245 960 250 1040 342" class="harness"/>
  <rect x="205" y="250" width="110" height="34" rx="8" class="tie"/>
  <text x="260" y="272" text-anchor="middle" class="tiny">rear tie-down</text>
  <rect x="885" y="250" width="110" height="34" rx="8" class="tie"/>
  <text x="940" y="272" text-anchor="middle" class="tiny">front tie-down</text>

  <rect x="390" y="170" width="420" height="72" rx="12" class="ok"/>
  <text x="600" y="199" text-anchor="middle" class="small">Good: route harness back to the chassis, then along the body</text>
  <text x="600" y="222" text-anchor="middle" class="small">Add a tie-down within 30-50 mm of each sensor case</text>

  <rect x="390" y="540" width="420" height="72" rx="12" class="bad"/>
  <text x="600" y="569" text-anchor="middle" class="small">Avoid: cable loop, screw head, bumper lip, or tape edge in the FOV cone</text>
  <text x="600" y="592" text-anchor="middle" class="small">Any occlusion can look like a real obstacle or corrupt range quality</text>

  <line x1="142" y1="415" x2="142" y2="520" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="142" y="542" text-anchor="middle" class="tiny">case back taped/screwed to bumper</text>
  <line x1="1062" y1="415" x2="1062" y2="520" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1062" y="542" text-anchor="middle" class="tiny">lid faces outward</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Mini-PCB VL53L8 Case Design</title>
  <desc id="desc">Snap-off mini PCB case with optical aperture, 30 AWG solder pigtails, interposer/regulator board, JST-GH connector, and mount options.</desc>
  <defs>
    <style>
      .label { font: 18px sans-serif; fill: #111827; }
      .small { font: 14px sans-serif; fill: #374151; }
      .outline { fill: #f8fafc; stroke: #263238; stroke-width: 2; }
      .case { fill: #fff7ed; stroke: #9a3412; stroke-width: 3; }
      .board { fill: #1e40af; opacity: 0.85; }
      .wire { stroke-width: 4; fill: none; }
    </style>
  </defs>

  <text x="560" y="40" text-anchor="middle" class="label">Snap-Off Mini-PCB: compact final path after electrical validation</text>

  <rect x="70" y="115" width="275" height="330" rx="16" class="case"/>
  <rect x="118" y="175" width="178" height="178" rx="10" class="board"/>
  <text x="207" y="205" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17">mini PCB</text>
  <rect x="188" y="252" width="50" height="34" rx="4" fill="#111827"/>
  <circle cx="213" cy="269" r="70" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="207" y="372" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">large aperture</text>
  <rect x="145" y="398" width="140" height="24" rx="6" fill="#fdba74"/>
  <text x="215" y="416" text-anchor="middle" class="small">strain bar</text>

  <rect x="470" y="120" width="265" height="150" rx="12" class="outline"/>
  <text x="602" y="155" text-anchor="middle" class="label">30 AWG pigtails</text>
  <path d="M296 232 C390 200 410 185 470 180" class="wire" stroke="#dc2626"/>
  <path d="M296 248 C392 225 410 205 470 205" class="wire" stroke="#111827"/>
  <path d="M296 264 C392 250 410 230 470 230" class="wire" stroke="#2563eb"/>
  <text x="602" y="190" text-anchor="middle" class="small">solder to 0.8 x 1.6 mm DUT pads</text>
  <text x="602" y="216" text-anchor="middle" class="small">UV resin or epoxy after continuity test</text>
  <text x="602" y="242" text-anchor="middle" class="small">do not put cable load on pads</text>

  <rect x="470" y="325" width="265" height="155" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="602" y="360" text-anchor="middle" class="label">Interposer Board</text>
  <text x="602" y="392" text-anchor="middle" class="small">provides DUT_AVDD / DUT_IOVDD</text>
  <text x="602" y="418" text-anchor="middle" class="small">level shifts if I/O is below 3.3 V</text>
  <text x="602" y="444" text-anchor="middle" class="small">exports keyed JST-GH harness</text>

  <rect x="835" y="145" width="230" height="110" rx="12" class="outline"/>
  <text x="950" y="180" text-anchor="middle" class="label">JST-GH Harness</text>
  <text x="950" y="212" text-anchor="middle" class="small">detachable at case</text>
  <text x="950" y="234" text-anchor="middle" class="small">pin 1 keyed and labeled</text>

  <rect x="835" y="350" width="230" height="130" rx="12" class="outline"/>
  <text x="950" y="385" text-anchor="middle" class="label">Mounting</text>
  <text x="950" y="417" text-anchor="middle" class="small">VHB on flat back</text>
  <text x="950" y="439" text-anchor="middle" class="small">or M2 side ears</text>
  <text x="950" y="461" text-anchor="middle" class="small">front/rear label on case</text>

  <path d="M735 402 C790 335 805 220 835 205" class="wire" stroke="#7c3aed"/>

  <text x="560" y="560" text-anchor="middle" class="small">Mini-PCB is not the full SATEL J2 interface. Do not connect 5 V directly to the snapped-off board.</text>
  <text x="560" y="585" text-anchor="middle" class="small">This path should wait until one full-SATEL sensor and the board-side adapter are mechanically stable.</text>
</svg>

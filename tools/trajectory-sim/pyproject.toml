[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openotter-trajectory-sim"
version = "0.1.0"
description = "Local OpenOtter trajectory-following simulation and controller prototyping"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openotter-sim = "openotter_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

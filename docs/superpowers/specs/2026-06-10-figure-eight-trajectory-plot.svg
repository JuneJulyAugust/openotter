  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#087ea4"/>
    </marker>
  </defs>
  <path d="M 500 320 C 570 215, 760 125, 840 320" fill="none" stroke="#087ea4" stroke-width="4" marker-end="url(#arrow)" opacity="0.9"/>
  <circle cx="500" cy="320" r="18" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="500" cy="320" r="11" fill="#2ca24d" stroke="#fff" stroke-width="4"/>
  <circle cx="508.9" cy="311.1" r="8" fill="#68c779" stroke="#fff" stroke-width="3"/>
  <circle cx="840" cy="320" r="10" fill="#ef4444" stroke="#fff" stroke-width="3"/>
  <circle cx="160" cy="320" r="10" fill="#7c3aed" stroke="#fff" stroke-width="3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#111827">
    <text x="520" y="352">green: start at center crossing, i=0, local (0, 0)</text>
    <text x="520" y="294">small green: i=1, first movement into forward/right branch</text>
    <text x="660" y="310">red: +x lobe peak, i=60</text>
    <text x="520" y="388">orange ring: second center crossing, i=120</text>
    <text x="60" y="310">purple: -x lobe peak, i=180</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#4b5563">
    <text x="30" y="36">Formula: local_x = 2.0 sin(t), local_z = 1.0 sin(2t). Controller uses 240 waypoints.</text>
    <text x="30" y="60">Track envelope: 4.0 m long by 2.0 m wide. Plot axes use local car frame: +x forward, +z right.</text>
    <text x="30" y="84">World path = this curve rotated by mission-start yaw and translated to mission-start pose.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenOtter smoother 4 m by 2 m figure-eight trajectory</title>
  <desc id="desc">Local car-frame figure-eight trajectory drawn from the same 240 arc-length-spaced waypoints used by the controller. X axis is forward, Z axis is right. Start is at the center crossing. Waypoint 1 enters the forward-right branch. The path crosses the center again halfway through the loop.</desc>
  <rect width="1000" height="720" fill="#fbfbfd"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#30343b">
    <text x="36" y="48" font-size="21">Controller path: smoother Bernoulli-style lemniscate, arc-length resampled to 240 waypoints</text>
    <text x="36" y="78" font-size="17">Track envelope: 4.0 m long by 2.0 m wide. Plot uses local car frame: +x forward, +z right.</text>
    <text x="36" y="104" font-size="17">World path = this local curve rotated by mission-start yaw and translated to mission-start pose.</text>
  </g>
  <g stroke="#d8dbe2" stroke-width="1">
    <line x1="120" y1="360" x2="880" y2="360"/>
    <line x1="500" y1="150" x2="500" y2="570"/>
    <line x1="140" y1="150" x2="140" y2="570" opacity="0.45"/>
    <line x1="860" y1="150" x2="860" y2="570" opacity="0.45"/>
    <line x1="120" y1="190" x2="880" y2="190" opacity="0.45"/>
    <line x1="120" y1="530" x2="880" y2="530" opacity="0.45"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#30343b">
    <text x="888" y="354">+x forward</text>
    <text x="512" y="144">+z right</text>
    <text x="88" y="354">-x</text>
    <text x="512" y="590">-z</text>
  </g>

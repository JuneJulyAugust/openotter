<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenOtter app-map 3.2 m by 1.6 m horizontal figure-eight trajectory</title>
  <desc id="desc">Local car-frame figure-eight trajectory drawn from the same 240 arc-length-spaced waypoints used by the controller. In the app map, +X is forward/up and +Z is right/horizontal. Start is at the center crossing. Waypoint 1 enters the forward-right branch. The path crosses the center again halfway through the loop.</desc>
  <rect width="1000" height="720" fill="#fbfbfd"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#30343b">
    <text x="36" y="48" font-size="21">Controller path: smoother Bernoulli-style lemniscate, arc-length resampled to 240 waypoints</text>
    <text x="36" y="78" font-size="17">Track envelope: 3.2 m left/right by 1.6 m forward/back. Plot uses app map: +x forward/up, +z right/horizontal.</text>
    <text x="36" y="104" font-size="17">World path = this local curve rotated by mission-start yaw and translated to mission-start pose.</text>
  </g>
  <g stroke="#d8dbe2" stroke-width="1">
    <line x1="120" y1="360" x2="880" y2="360"/>
    <line x1="500" y1="150" x2="500" y2="570"/>
    <line x1="212" y1="150" x2="212" y2="570" opacity="0.45"/>
    <line x1="788" y1="150" x2="788" y2="570" opacity="0.45"/>
    <line x1="120" y1="224" x2="880" y2="224" opacity="0.45"/>
    <line x1="120" y1="496" x2="880" y2="496" opacity="0.45"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#30343b">
    <text x="888" y="354">+z right</text>
    <text x="512" y="144">+x forward</text>
    <text x="88" y="354">-z</text>
    <text x="512" y="590">-x</text>
  </g>
